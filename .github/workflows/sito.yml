# Costruisce e pubblica il sito a ogni modifica portata su main.
#
# Non c'è niente da fare a mano: si scrive markdown, si fa push, e dopo un
# minuto il sito è aggiornato. Lo stato di ogni pubblicazione si vede nella
# scheda «Actions» del repository.

name: Pubblica il sito

on:
  push:
    branches: [main]
  workflow_dispatch:        # permette di rilanciarlo a mano da GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  costruisci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa il convertitore markdown
        run: pip install markdown

      - name: Costruisci il sito
        run: python tools/costruisci_sito.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pubblica:
    needs: costruisci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
